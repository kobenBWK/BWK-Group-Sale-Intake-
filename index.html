<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Waters Kayaking — Group Inquiry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1A1A; --teal:#39BEAD; --teal-dark:#237566; --mist:#F3FAF9;
    --good:#2E8F6B; --bad:#B14343; --muted:#7A8985; --line:#D7E6E3; --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--mist);color:var(--ink);font-family:'IBM Plex Sans', sans-serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:640px;margin:0 auto;padding:28px 20px 80px;}
  .wordmark{margin-bottom:20px;}
  .wordmark img{height:56px;display:block;}
  .wordmark p{margin:8px 0 0;font-size:12.5px;color:var(--muted);}
  .form-intro{font-size:14px;color:var(--muted);margin:0 0 26px;line-height:1.5;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:14.5px;font-weight:500;color:var(--ink);margin-bottom:3px;}
  .field .example{font-size:12.5px;color:#9AA9A5;font-style:italic;margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%;border:1px solid var(--line);background:var(--card);border-radius:3px;
    padding:9px 11px;font-family:inherit;font-size:14.5px;color:var(--ink);resize:vertical;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal);}
  .btn{font-family:'IBM Plex Sans', sans-serif;font-weight:600;font-size:14.5px;border:none;border-radius:3px;padding:11px 20px;cursor:pointer;}
  .btn-primary{background:var(--teal-dark);color:#fff;}
  .btn-primary:hover{background:#1A5147;}
  .btn-secondary{background:transparent;color:var(--teal-dark);border:1px solid var(--teal);}
  .btn-secondary:hover{background:#E3EEEC;}
  .btn:disabled{opacity:0.5;cursor:default;}
  .review-card{border:1px solid var(--line);border-radius:4px;background:var(--card);padding:18px 20px;margin-bottom:18px;}
  .review-card h3{font-family:'Fraunces', serif;font-weight:500;font-size:16.5px;margin:0 0 3px;color:var(--teal-dark);}
  .review-card .to-line{font-size:12.5px;color:var(--muted);margin-bottom:12px;font-family:monospace;}
  .review-card input.subject{width:100%;border:1px solid var(--line);border-radius:3px;padding:8px 10px;font-size:14px;margin-bottom:8px;font-family:inherit;}
  .review-card textarea.body{width:100%;min-height:150px;border:1px solid var(--line);border-radius:3px;padding:10px;font-size:13.5px;font-family:inherit;line-height:1.5;}
  .send-status{font-size:13px;margin-top:8px;}
  .send-status.ok{color:var(--good);}
  .send-status.err{color:var(--bad);}
  .fallback-box{background:var(--mist);border:1px dashed var(--line);border-radius:3px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-top:8px;}
  .setup-warning{background:#FBEEEA;border:1px solid #F0CFC4;color:var(--bad);border-radius:4px;padding:12px 14px;font-size:13px;margin-bottom:22px;}
</style>
</head>

<script>
/* ============ CONFIG — fill these in after deploying the Apps Script ============ */
const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyhWTHUxnT1fXzbhvBcElWK4bq7DIxS4KgrNxurVe4T-PySWp79TwZzhMCAv9lt7-5y/exec";
const WEBHOOK_SECRET = "bwk-9f2xk-inquiry-4471";
/* ================================================================================= */

const KOBEN_EMAIL = "koben@bluewaterskayaking.com";
const INFO_EMAIL  = "info@bluewaterskayaking.com";

const FIELDS = [
  {id:"loggedBy",   label:"Logged by",                         example:"",                                                     type:"select", options:["Elle","Luca","Lori","Pam"]},
  {id:"contactName",label:"Key contact name",                 example:"e.g., Jane Smith",                                    type:"input"},
  {id:"org",        label:"Organization / troop number",      example:"e.g., Girl Scout Troop 4521, Acme Corp, Smith family reunion", type:"input"},
  {id:"email",      label:"Email",                             example:"e.g., jane@email.com",                                type:"input"},
  {id:"phone",      label:"Phone",                             example:"e.g., (360) 555-0148",                                type:"input"},
  {id:"leadSource", label:"Lead source",                       example:"",                                                     type:"select", options:["Phone call","Walk-in","Email","Website form"]},
  {id:"activity",   label:"Activity of interest",              example:"e.g., guided kayak tour, SUP rental, sunset paddle",  type:"input"},
  {id:"privacy",    label:"Private group or open to the public",example:"e.g., private group only, open to join a public tour", type:"input"},
  {id:"ageRange",   label:"Age range of participants",         example:"e.g., mostly adults 30–50, mixed ages 8–70",          type:"input"},
  {id:"location",   label:"Location",                          example:"e.g., Heart's Desire Beach, Drake's Estero, etc.",    type:"input"},
  {id:"groupSize",  label:"Group size",                        example:"",                                                     type:"input"},
  {id:"budget",     label:"Budget",                            example:"",                                                     type:"input"},
  {id:"tripNature", label:"Nature of this trip",               example:"e.g., business offsite, birthday, bachelorette party, school field trip", type:"input"},
  {id:"staying",    label:"Where are they staying",            example:"e.g., Marconi, Nicks Cove, etc.",                     type:"input"},
  {id:"specialRequests", label:"Special requests",             example:"e.g., vegetarian snacks, ADA-accessible launch, need a photographer", type:"textarea"},
  {id:"notes",      label:"Anything else to know",             example:"e.g., first-time paddlers, celebrating a retirement", type:"textarea"},
  {id:"dates",      label:"Dates they're in the area",         example:"e.g., July 12–15",                                    type:"input"},
  {id:"flexibility",label:"Flexibility / alternate dates",     example:"e.g., can shift ±2 days, only available weekends",    type:"input"},
];

function escapeHtml(s){ return (s||"").toString().replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }
function fieldLabel(id){ return (FIELDS.find(f=>f.id===id)||{}).label || id; }
function isConfigured(){ return WEBHOOK_URL.indexOf("PASTE_") !== 0; }

async function callWebhookPost(payload){
  const resp = await fetch(WEBHOOK_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  });
  return resp.json();
}

/* ---------------- FORM ---------------- */
function renderForm(){
  const wrap = document.getElementById("form-wrap");
  let html = "";
  if(!isConfigured()){
    html += `<div class="setup-warning">Setup isn't finished yet: this form can't save inquiries or send email until WEBHOOK_URL and WEBHOOK_SECRET are filled in at the top of the script, pointing at your deployed Apps Script Web App.</div>`;
  }
  html += `<p class="form-intro">Fill in whatever the lead has shared — every field is optional. The italic line under each label is just a prompt for the kind of answer to jot down.</p>`;
  FIELDS.forEach(f=>{
    let control;
    if(f.type === "select"){
      control = `<select id="f-${f.id}"><option value=""></option>` +
        f.options.map(o=>`<option value="${escapeAttr(o)}">${escapeHtml(o)}</option>`).join("") +
        `</select>`;
    } else if(f.type === "textarea"){
      control = `<textarea id="f-${f.id}" rows="3"></textarea>`;
    } else {
      control = `<input id="f-${f.id}" type="text">`;
    }
    html += `<div class="field">
      <label for="f-${f.id}">${f.label}</label>
      ${f.example ? `<div class="example">${f.example}</div>` : ""}
      ${control}
    </div>`;
  });
  html += `<button class="btn btn-primary" id="submit-inquiry-btn">Save inquiry &amp; prepare emails</button>`;
  wrap.innerHTML = html;
  document.getElementById("submit-inquiry-btn").addEventListener("click", onSubmitInquiry);
}

function collectFormData(){
  const data = {};
  FIELDS.forEach(f=>{ data[f.id] = document.getElementById("f-"+f.id).value.trim(); });
  return data;
}

async function onSubmitInquiry(){
  const data = collectFormData();
  const hasAny = Object.values(data).some(v=>v);
  if(!hasAny){ alert("Add at least one field before saving."); return; }
  if(!isConfigured()){ alert("This form isn't fully set up yet — see the notice at the top."); return; }

  const btn = document.getElementById("submit-inquiry-btn");
  btn.disabled = true; btn.textContent = "Saving…";

  const inquiry = {
    id: "inq_" + Date.now() + "_" + Math.random().toString(36).slice(2,8),
    timestamp: new Date().toISOString(),
    ...data
  };

  try{
    const res = await callWebhookPost({secret: WEBHOOK_SECRET, action: "saveInquiry", inquiry});
    if(res.error) throw new Error(res.error);
    renderReview(inquiry);
  }catch(e){
    btn.disabled = false; btn.textContent = "Save inquiry & prepare emails";
    alert("Couldn't save this inquiry (" + e.message + "). Please try again.");
  }
}

/* ---------------- REVIEW / SEND ---------------- */
function buildInternalEmail(inq){
  const lines = FIELDS.filter(f=>f.id!=="loggedBy").map(f=>{
    const v = inq[f.id];
    return `${fieldLabel(f.id)}: ${v ? v : "—"}`;
  });
  const subject = `New group inquiry — ${inq.org || inq.contactName || "unnamed lead"}`;
  const body = `A new group inquiry was logged${inq.loggedBy ? " by " + inq.loggedBy : ""}.

${lines.join("\n")}

Logged: ${new Date(inq.timestamp).toLocaleString()}`;
  return {subject, body};
}

function buildClientEmail(inq){
  const shareFields = ["activity","privacy","ageRange","location","groupSize","tripNature","staying","specialRequests","dates","flexibility"];
  const lines = shareFields.filter(id=>inq[id]).map(id=>`${fieldLabel(id)}: ${inq[id]}`);
  const subject = `Thanks for reaching out to Blue Waters Kayaking!`;
  const body = `Hi ${inq.contactName || "there"},

Thanks for your interest in a group trip with Blue Waters Kayaking! Here's what we have on file so far:

${lines.length ? lines.join("\n") : "(details to be confirmed)"}

Our group sales team will follow up with you shortly to firm up the details.

Talk soon,
Blue Waters Kayaking`;
  return {subject, body};
}

function renderReview(inq){
  const wrap = document.getElementById("form-wrap");
  const internal = buildInternalEmail(inq);
  const hasClientEmail = !!inq.email;
  const client = buildClientEmail(inq);

  let html = `<p class="form-intro">Inquiry saved. Review the emails below, edit anything, then send.</p>`;

  html += `<div class="review-card" id="card-internal">
    <h3>Internal summary</h3>
    <div class="to-line">To: ${KOBEN_EMAIL}</div>
    <input class="subject" id="internal-subject" value="${escapeAttr(internal.subject)}">
    <textarea class="body" id="internal-body">${escapeHtml(internal.body)}</textarea>
  </div>`;

  if(hasClientEmail){
    html += `<div class="review-card" id="card-client">
      <h3>Client confirmation</h3>
      <div class="to-line">To: ${escapeHtml(inq.email)} — Cc: ${INFO_EMAIL}</div>
      <input class="subject" id="client-subject" value="${escapeAttr(client.subject)}">
      <textarea class="body" id="client-body">${escapeHtml(client.body)}</textarea>
    </div>`;
  } else {
    html += `<div class="review-card"><h3>Client confirmation</h3>
      <p style="font-size:13px;color:var(--muted);margin:0;">No client email was entered, so only the internal summary will be sent.</p>
    </div>`;
  }

  html += `<button class="btn btn-primary" id="send-btn">Send</button>
    <button class="btn btn-secondary" id="new-inquiry-btn" style="margin-left:8px;">Log another inquiry</button>
    <div id="send-status"></div>`;

  wrap.innerHTML = html;
  document.getElementById("new-inquiry-btn").addEventListener("click", renderForm);
  document.getElementById("send-btn").addEventListener("click", ()=>onSend(inq, hasClientEmail));
}

function fallbackBox(e){
  if(!e) return "";
  const mailto = `mailto:${encodeURIComponent(e.to)}?${e.cc ? "cc="+encodeURIComponent(e.cc)+"&" : ""}subject=${encodeURIComponent(e.subject)}&body=${encodeURIComponent(e.body)}`;
  return `<div class="fallback-box">Send it yourself instead: <a href="${mailto}" target="_blank">open in your email client</a>.</div>`;
}

async function onSend(inq, hasClientEmail){
  const btn = document.getElementById("send-btn");
  const statusEl = document.getElementById("send-status");
  btn.disabled = true;
  statusEl.innerHTML = `<p class="send-status">Sending…</p>`;

  const emailsToSend = [
    {label:"internal", to: KOBEN_EMAIL, cc: "", subject: document.getElementById("internal-subject").value, body: document.getElementById("internal-body").value}
  ];
  if(hasClientEmail){
    emailsToSend.push({
      label:"client", to: inq.email, cc: INFO_EMAIL,
      subject: document.getElementById("client-subject").value,
      body: document.getElementById("client-body").value
    });
  }

  try{
    const res = await callWebhookPost({secret: WEBHOOK_SECRET, action: "sendEmails", emails: emailsToSend});
    if(res.error) throw new Error(res.error);
    let html = "";
    (res.results||[]).forEach(r=>{
      const label = r.label === "internal" ? "Internal summary" : "Client confirmation";
      if(r.sent){
        html += `<p class="send-status ok">✓ ${label} sent.</p>`;
      } else {
        html += `<p class="send-status err">✗ ${label} did not send${r.error ? " — " + escapeHtml(r.error) : ""}.</p>`;
        html += fallbackBox(emailsToSend.find(e=>e.label===r.label));
      }
    });
    statusEl.innerHTML = html;
  }catch(e){
    statusEl.innerHTML = `<p class="send-status err">✗ Couldn't reach the send service (${escapeHtml(e.message)}).</p>` + emailsToSend.map(fallbackBox).join("");
  }
  btn.disabled = false;
}

renderForm();
</script>
</body>
</html>
